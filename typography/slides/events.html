<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Events Practice</title>
</head>

<body>

    <h1>JavaScript Events Practice</h1>

    <!-- Click -->
    <h2>1. Click Event</h2>

    <button id="clickBtn">Click Me</button>

    <p id="clickResult"></p>


    <!-- Mouse -->
    <h2>2. Mouse Events</h2>

    <div id="mouseBox">
        Move your mouse here
    </div>

    <p id="mouseResult"></p>


    <!-- Double Click -->
    <h2>3. Double Click</h2>

    <button id="doubleBtn">Double Click Me</button>

    <p id="doubleResult"></p>


    <!-- Keyboard -->
    <h2>4. Keyboard Events</h2>

    <input
        type="text"
        id="keyboardInput"
        placeholder="Press a key"
    >

    <p id="keyboardResult"></p>


    <!-- Input -->
    <h2>5. Input Event</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Type your name"
    >

    <p id="nameResult"></p>


    <!-- Change -->
    <h2>6. Change Event</h2>

    <select id="course">

        <option value="">Select Course</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>

    </select>

    <p id="courseResult"></p>


    <!-- Submit -->
    <h2>7. Submit Event</h2>

    <form id="myForm">

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <button type="submit">
            Submit
        </button>

    </form>

    <p id="formResult"></p>


    <!-- Event Object -->
    <h2>8. Event Object</h2>

    <button id="eventBtn">
        Check Event
    </button>

    <p id="eventResult"></p>




    <script src="events.js"></script>

</body>
</html>
