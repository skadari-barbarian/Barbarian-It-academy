<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form</title>
    <link rel="stylesheet" href="from.css">
</head>

<body>

    <h1>Complete HTML Form</h1>

    <form action="/submit" method="post">

        <!-- Text Input -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name" required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required>

        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter phone number">

        <br><br>

        <!-- Number -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               min="18" max="100">

        <br><br>

        <!-- Date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <!-- Time -->
        <label for="time">Preferred Time:</label>
        <input type="time" id="time" name="time">

        <br><br>

        <!-- Date and Time -->
        <label for="meeting">Meeting Date & Time:</label>
        <input type="datetime-local" id="meeting" name="meeting">

        <br><br>

        <!-- Month -->
        <label for="month">Joining Month:</label>
        <input type="month" id="month" name="month">

        <br><br>

        <!-- Week -->
        <label for="week">Select Week:</label>
        <input type="week" id="week" name="week">

        <br><br>

        <!-- URL -->
        <label for="website">Website:</label>
        <input type="url" id="website" name="website"
               placeholder="https://example.com">

        <br><br>

        <!-- Search -->
        <label for="search">Search:</label>
        <input type="search" id="search" name="search">

        <br><br>

        <!-- Radio Buttons -->
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <!-- Checkboxes -->
        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <!-- Select / Dropdown -->
        <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="">-- Select Country --</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
        </select>

        <br><br>

        <!-- Multiple Select -->
        <label for="languages">Programming Languages:</label>

        <select id="languages" name="languages" multiple>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
            <option value="cpp">C++</option>
        </select>

        <br><br>

        <!-- Textarea -->
        <label for="message">Message:</label>
        <br>

        <textarea id="message" name="message"
                  rows="5" cols="40"
                  placeholder="Enter your message"></textarea>

        <br><br>

        <!-- File Upload -->
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">

        <br><br>

        <!-- Color -->
        <label for="color">Choose Color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <!-- Range -->
        <label for="experience">Experience:</label>
        <input type="range" id="experience" name="experience"
               min="0" max="10" value="2">

        <br><br>

        <!-- Hidden Input -->
        <input type="hidden" name="user_id" value="12345">

        <!-- Fieldset -->
        <fieldset>

            <legend>Address</legend>

            <label for="address">Address:</label>
            <br>

            <textarea id="address" name="address"
                      rows="4" cols="40"></textarea>

            <br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city">

            <br><br>

            <label for="pincode">PIN Code:</label>
            <input type="text" id="pincode" name="pincode">

        </fieldset>

        <br>

        <!-- Datalist -->
        <label for="browser">Choose Browser:</label>

        <input list="browsers" id="browser" name="browser">

        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Edge">
            <option value="Safari">
        </datalist>

        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit">

        <!-- Reset Button -->
        <input type="reset" value="Reset">

        <!-- Normal Button -->
        <button type="button">Click Me</button>

    </form>

</body>
</html>
