<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location API Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f5f5f5;
    }

    h1 {
      color: #2c3e50;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #0a0f12;
      color: rgb(223, 22, 22);
    }

    button {
      margin: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
  <link id="barbarian-font" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Barbarian Brand Overrides -->
    <style id="barbarian-styles">
      body {
        background: #000000 !important;
        color: #ffffff !important;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      .container {
        background: #121212 !important;
        border: 1px solid #222222 !important;
        color: #ffffff !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: Inter, sans-serif !important;
      }
      h1 { color: #ff4400 !important; }
      h2 { color: #ffffff !important; }
      p, li, td { color: #060202 !important; }
      a { color: #1a73e8 !important; }
      code, pre, .code, .number, .file, .tag {
        font-family: 'Fira Code', monospace !important;
      }
      .highlight, strong, b {
        color: #ff4400 !important;
      }
      footer {
        color: #777777 !important;
      }
    </style>

</head>
<body>

<h1>Location API Practice</h1>

<table>
  <tr>
    <th>Property</th>
    <th>Value</th>
  </tr>
  <tbody id="locationData"></tbody>
</table>

<h2>Try These</h2>

<button onclick="location.reload()">
    Reload Page
</button>

<button onclick="location.assign('https://example.com')">
    Go to Example.com
</button>

<button onclick="location.replace('https://example.com')">
    Replace with Example.com
</button>

<button onclick="showInfo()">
    Refresh Values
</button>

<script>
function showInfo() {

    const data = [
        ["href", location.href],
        ["protocol", location.protocol],
        ["host", location.host],
        ["hostname", location.hostname],
        ["port", location.port || "(default)"],
        ["pathname", location.pathname],
        ["search", location.search || "(none)"],
        ["hash", location.hash || "(none)"],
        ["origin", location.origin]
    ];

    const tbody = document.getElementById("locationData");

    tbody.innerHTML = "";

    data.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item[0]}</td>
                <td>${item[1]}</td>
            </tr>
        `;
    });
}

showInfo();
</script>

</body>
</html>
