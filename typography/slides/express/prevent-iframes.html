<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventing Iframes Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #f1f1f1;
            padding: 30px;
        }
        h1 {
            color: #e63946;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #8a8a8a;
            font-size: 14px;
            margin-bottom: 20px;
        }
        iframe {
            border: 2px dashed #e63946;
            border-radius: 8px;
            background: #fff;
        }
    </style>
  <link id="barbarian-font" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Barbarian Brand Overrides -->
    <style id="barbarian-styles">
      body {
        background: #000000 !important;
        color: #ffffff !important;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      .container {
        background: #121212 !important;
        border: 1px solid #222222 !important;
        color: #ffffff !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: Inter, sans-serif !important;
      }
      h1 { color: #ff4400 !important; }
      h2 { color: #ffffff !important; }
      p, li, td { color: #cfcfcf !important; }
      a { color: #1a73e8 !important; }
      code, pre, .code, .number, .file, .tag {
        font-family: 'Fira Code', monospace !important;
      }
      .highlight, strong, b {
        color: #ff4400 !important;
      }
      footer {
        color: #777777 !important;
      }
    </style>

</head>
<body>
    <h1>Preventing Iframes Demo</h1>
    <p>This page embeds Server 2 (<code>http://localhost:3001</code>) inside an iframe. If Server 2 has <code>X-Frame-Options: DENY</code> enabled, the browser will refuse to load it.</p>
    <iframe src="http://localhost:3001" width="100%" height="400" title="Server 2 (Blocked)"></iframe>
</body>
</html>
