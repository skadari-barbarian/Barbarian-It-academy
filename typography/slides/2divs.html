<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Divs</title>
    <link rel="stylesheet" href="2divs.css">
</head>
<body>

    <div class="container">
        <div class="box">
            <h1>First Div</h1>
            <p>
                This is the first div. It contains some text.
            </p>

        </div>

        <div class="box">
            <h1>Second Div</h1>
            <p>
                This is the second div. It contains different content over first.
            </p>
        </div>

    </div>

</body>
</html>
