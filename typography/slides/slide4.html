<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Font Size </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:15px;
}

.definition{
    text-align:center;
    color:#555;
    font-size:18px;
    margin-bottom:40px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}


/* Font Size */
.size12{font-size:12px;}
.size18{font-size:18px;}
.size24{font-size:24px;}
.size32{font-size:32px;}
.size40{font-size:40px;}

.card p{
    margin:15px 0;
    line-height:1.6;
}

.note{
    margin-top:35px;
    background:#eef7ff;
    padding:20px;
    border-left:5px solid #0077cc;
    border-radius:5px;
}

code{
    color:#d63384;
    font-size:17px;
}
</style>

  <link id="barbarian-font" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Barbarian Brand Overrides -->
    <style id="barbarian-styles">
      body {
        background: #000000 !important;
        color: #ffffff !important;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      .container {
        background: #121212 !important;
        border: 1px solid #222222 !important;
        color: #ffffff !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: Inter, sans-serif !important;
      }
      h1 { color: #ff4400 !important; }
      h2 { color: #ffffff !important; }
      p, li, td { color: #cfcfcf !important; }
      a { color: #1a73e8 !important; }
      code, pre, .code, .number, .file, .tag {
        font-family: 'Fira Code', monospace !important;
      }
      .highlight, strong, b {
        color: #ff4400 !important;
      }
      footer {
        color: #777777 !important;
      }
    </style>

</head>
<body>

<h1>CSS Font Size </h1>

<p class="definition">
<b>font-size</b> changes the size of the text, while
</p>

<div class="container">

    <!-- Font Size -->
    <div class="card">
        <h2>Font Size</h2>

        <p class="size12">font-size: 12px</p>
        <p class="size18">font-size: 18px</p>
        <p class="size24">font-size: 24px</p>
        <p class="size32">font-size: 32px</p>
        <p class="size40">font-size: 40px</p>

    </div>

</div>
</div>

</body>
</html>
