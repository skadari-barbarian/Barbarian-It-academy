<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Car</title>
    <link rel="stylesheet" href="car.css">
  <link id="barbarian-font" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />


    <style id="barbarian-styles">
      body {
        background: #000000 !important;
        color: #ffffff !important;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      .container {
        background: #121212 !important;
        border: 1px solid #222222 !important;
        color: #ffffff !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: Inter, sans-serif !important;
      }
      h1 { color: #ff4400 !important; }
      h2 { color: #ffffff !important; }
      p, li, td { color: #cfcfcf !important; }
      a { color: #1a73e8 !important; }
      code, pre, .code, .number, .file, .tag {
        font-family: 'Fira Code', monospace !important;
      }
      .highlight, strong, b {
        color: #ff4400 !important;
      }
      footer {
        color: #777777 !important;
      }
    </style>
<body>

<div class="car">
    <div id="roof" class="roof change"></div>
    <div class="window left-window"></div>
    <div class="window right-window"></div>

    <div id="body" class="body change"></div>
    <div id="door" class="door change"></div>

    <div class="handle"></div>
    <div class="headlight"></div>
    <div class="taillight"></div>

    <div class="wheel left-wheel">
        <div class="rim"></div>
    </div>

    <div class="wheel right-wheel">
        <div class="rim"></div>
    </div>
</div>

<div class="buttons">
    <button id="red-btn">Red</button>
    <button id="blue-btn">Blue</button>
    <button id="green-btn">Green</button>
    <button id="yellow-btn">Yellow</button>
    <button id="#108aec">Blue2</button>
</div>

<script src="car.js"></script>

</body>
</html>
